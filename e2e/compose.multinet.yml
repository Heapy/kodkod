# Scenario N — Multi-network reconnect (plan fix 4).
#
# app is attached to two user-defined networks. Docker rejects more than one
# endpoint at create time, so kodkod must create on the first network and then
# connect the rest before starting. After an update app must end up on BOTH.
name: e2e-multinet
networks:
  neta:
  netb:
services:
  app:
    image: 127.0.0.1:5000/testapp:latest
    networks:
      - neta
      - netb
    labels:
      kodkod.update.enable: "true"

  # A live source for the MacAddress rule: an explicitly requested MAC is the only one kodkod may carry
  # into the replacement. Only engines that still report `Config.MacAddress` (removed in Docker >= 27)
  # let kodkod tell it from the endpoint MAC the daemon generates for every container.
  mac:
    image: 127.0.0.1:5000/testapp:latest
    mac_address: "02:42:ac:1f:00:63"
    networks:
      - neta
    labels:
      kodkod.update.enable: "true"

  kodkod:
    image: kodkod:e2e
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KODKOD_AUTOHEAL_ENABLED: "false"
      KODKOD_UPDATE_INTERVAL: "15"
      KODKOD_UPDATE_START_PERIOD: "5"
      # This scenario is about ordering and create-time fidelity, not the liveness gate — and none
      # of its images declares a healthcheck, so the gate has no positive evidence to end on and
      # every recreate would hold the cycle for the whole 15s default before the next one starts.
      KODKOD_UPDATE_VERIFY_SECONDS: "2"

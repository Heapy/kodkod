# Scenario C — network_mode: container: resolution (plan fix 4).
#
# consumer shares provider's network namespace. Compose resolves
# `network_mode: service:provider` to `container:<provider-id>` in the consumer's
# HostConfig. When kodkod recreates consumer (its image changed), it must rewrite
# that to `container:<provider-NAME>` so the reference survives provider itself
# being recreated later (an id would go stale; a name does not).
#
# Known limitation (documented in E2E_TESTING.md): if the *provider* is updated,
# consumer is only restarted, not recreated, so a stale container:<id> would not
# re-point. Here we update the *consumer* to validate the rewrite cleanly.
name: e2e-cmode
services:
  provider:
    image: busybox:1.36
    command: ["sh", "-c", "echo '[provider] started'; while true; do sleep 1; done"]

  consumer:
    image: 127.0.0.1:5000/testapp:latest
    network_mode: "service:provider"
    depends_on:
      - provider
    labels:
      kodkod.update.enable: "true"

  kodkod:
    image: kodkod:e2e
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KODKOD_AUTOHEAL_ENABLED: "false"
      KODKOD_UPDATE_INTERVAL: "15"
      KODKOD_UPDATE_START_PERIOD: "5"

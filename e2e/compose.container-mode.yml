# Scenario C — network_mode: container: resolution (plan fix 4).
#
# consumer shares provider's network namespace. Compose resolves
# `network_mode: service:provider` to `container:<provider-id>` in the consumer's
# HostConfig. When kodkod recreates provider, consumer is not stale itself, but it
# must also be recreated so Docker refreshes the create-time NetworkMode reference.
name: e2e-cmode
services:
  provider:
    image: 127.0.0.1:5000/testapp:latest
    labels:
      kodkod.update.enable: "true"

  consumer:
    image: busybox:1.36
    command: ["sh", "-c", "echo '[consumer] started'; while true; do sleep 1; done"]
    network_mode: "service:provider"
    depends_on:
      - provider
    labels:
      kodkod.update.enable: "true"

  # Same namespace sharing as `consumer`, but with NO kodkod label at all. With
  # KODKOD_UPDATE_MONITOR_ALL=false (the documented default) discovery never sees this container, so the
  # dependency graph cannot help it: when provider is replaced, the namespace this container is joined to
  # is destroyed and it keeps reporting Running with no interfaces. Only the daemon-wide create-time
  # dependent scan can save it (plan task 18).
  sidecar:
    image: busybox:1.36
    command: ["sh", "-c", "echo '[sidecar] started'; while true; do sleep 1; done"]
    network_mode: "service:provider"
    depends_on:
      - provider

  kodkod:
    image: kodkod:e2e
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KODKOD_AUTOHEAL_ENABLED: "false"
      KODKOD_UPDATE_INTERVAL: "15"
      KODKOD_UPDATE_START_PERIOD: "5"
      # This scenario is about ordering and create-time fidelity, not the liveness gate — and none
      # of its images declares a healthcheck, so the gate has no positive evidence to end on and
      # every recreate would hold the cycle for the whole 15s default before the next one starts.
      KODKOD_UPDATE_VERIFY_SECONDS: "2"

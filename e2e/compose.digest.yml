# Scenario P — Digest-pinned containers are never updated.
#
# app is pinned to a specific digest via ${TESTAPP_DIGEST}. Even after the
# :latest tag is overwritten with v2, kodkod must log "digest-pinned — skipping"
# and leave the container untouched.
#
# Capture the digest after pushing v1 (see E2E_TESTING.md):
#   export TESTAPP_DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' \
#       127.0.0.1:5000/testapp:latest | cut -d@ -f2)
name: e2e-digest
services:
  app:
    image: 127.0.0.1:5000/testapp@${TESTAPP_DIGEST:?set TESTAPP_DIGEST to the pushed v1 digest}
    labels:
      kodkod.update.enable: "true"

  kodkod:
    image: kodkod:e2e
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KODKOD_AUTOHEAL_ENABLED: "false"
      KODKOD_UPDATE_INTERVAL: "12"
      KODKOD_UPDATE_START_PERIOD: "3"
